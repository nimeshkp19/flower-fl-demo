[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-demo"
version = "1.0.0"
description = "Federated Learning demo with Flower - MNIST, non-IID clients"
license = "MIT"
dependencies = [
    "flwr[simulation]>=1.37.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "matplotlib>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fl_demo"]

[tool.flwr.app]
publisher = "your-name"

[tool.flwr.app.components]
serverapp = "fl_demo.server_app:app"
clientapp = "fl_demo.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
fraction-evaluate = 1.0
learning-rate = 0.01
batch-size = 32
local-epochs = 1